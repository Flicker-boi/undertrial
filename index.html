<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Özel Font Test Sayfası</title>
    <style>
        /* 1. Font Tanımlaması (Notethis) */
        @font-face {
            font-family: 'Notethis';
            src: url('notethis.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        /* 2. Font Tanımlaması (Wh) */
        @font-face {
            font-family: 'WhFont';
            src: url('wh.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        /* Genel Sayfa Tasarımı */
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            background: #2a2a2a;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            max-width: 600px;
        }

        /* 1. Fontun Uygulandığı Alan */
        .font-one {
            font-family: 'Notethis', sans-serif;
            font-size: 32px;
            color: #4CAF50;
            margin-bottom: 20px;
        }

        /* 2. Fontun Uygulandığı Alan */
        .font-two {
            font-family: 'WhFont', monospace;
            font-size: 28px;
            color: #FF9800;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="font-one">Bu metin Notethis fontu ile yazılmıştır.</div>
        <div class="font-two">Bu metin Wh fontu ile yazılmıştır.</div>
    </div>

</body>
</html>
