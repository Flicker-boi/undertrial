<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Undertale - Deneme Takip</title>
    <link rel="icon" type="image/png" href="nn.png">
    <link rel="manifest" href="./manifest.json">
    <style>
        @font-face {
            font-family: 'WhFont';
            src: url('fonts/wh.ttf') format('truetype');
        }
        @font-face {
            font-family: 'NoteThis';
            src: url('fonts/notethis.ttf') format('truetype');
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        body { 
            font-family: 'WhFont', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important; 
            max-width: 600px; 
            margin: 0 auto; 
            padding: 10px; 
            background: #000 url('neden.gif') no-repeat center center fixed; 
            background-size: cover; 
            color: white !important; 
            user-select: none;
        }
        
        body.kaka-bg {
            background: #000 url('kaka.png') no-repeat center center fixed !important;
            background-size: cover !important;
        }

        body.bb-bg {
            background: #000 url('bb.gif') no-repeat center center fixed !important;
            background-size: cover !important;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: -1;
            transition: opacity 1s ease-in-out;
        }

        body.kaka-bg::before, body.bb-bg::before {
            opacity: 0;
            pointer-events: none;
        }

        .card { 
            background: black; 
            border: 4px solid white; 
            border-radius: 5px; 
            padding: 12px; 
            margin-bottom: 12px; 
            box-sizing: border-box;
            width: 100%;
            transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
        }

        body.kaka-bg .card, body.kaka-bg .top-bar, body.kaka-bg #welcomeScreen,
        body.bb-bg .card:not(#bbContentArea .card), body.bb-bg #normalTopBar, body.bb-bg #welcomeScreen {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95);
            display: none;
        }

        body.bb-bg #bbTopBar {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
            display: flex;
        }

        body.bb-bg #bbContentArea {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
            display: block !important;
        }

        body.bb-bg #bbContentArea .card {
            opacity: 1 !important;
            pointer-events: auto !important;
            transform: scale(1) !important;
            display: block !important;
        }

        .bb-return-btn {
            background: black;
            color: white !important;
            border: 3px solid white;
            padding: 8px 12px;
            font-family: 'WhFont', cursive !important;
            font-size: 10px !important;
            cursor: pointer;
            border-radius: 5px;
            flex: 1;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            box-sizing: border-box;
        }
        .bb-return-btn:hover { background: white; color: black !important; border-color: #ffff00; }

        h3 { 
            margin-top: 0; 
            color: #ffff00 !important; 
            font-size: 13px !important; 
            font-family: 'WhFont', cursive !important; 
            text-shadow: 2px 2px #333;
            margin-bottom: 10px;
        }

        .form-group { margin-bottom: 10px; }
        
        label { 
            display: block; 
            font-size: 10px !important; 
            font-family: 'WhFont', cursive !important;
            color: #ffffff !important; 
            margin-bottom: 4px; 
        }

        input, select { 
            width: 100%; 
            padding: 8px 10px; 
            border: 2px solid white; 
            background: black; 
            color: white !important; 
            border-radius: 0px; 
            box-sizing: border-box; 
            font-size: 11px !important; 
            font-family: 'WhFont', cursive !important;
            user-select: text; 
            outline: none;
        }
        input:focus, select:focus { border-color: #ffff00; }

        .row { display: flex; gap: 6px; }

        .start-text-btn {
            background: none;
            border: none;
            color: #ffffff !important;
            font-family: 'WhFont', cursive !important;
            font-size: 13px !important;
            cursor: pointer;
            padding: 8px;
            margin-top: 6px;
            width: 100%;
            text-align: left;
            transition: color 0.2s, transform 0.2s;
            outline: none;
        }
        .start-text-btn:hover {
            color: #ffff00 !important;
            transform: scale(1.01);
        }

        .top-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            align-items: stretch;
            transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
        }

        #bbTopBar {
            display: none;
            margin-bottom: 12px;
            align-items: stretch;
            opacity: 0;
            pointer-events: none;
        }

        #bbContentArea {
            display: none;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
        }

        .music-panel { 
            background: black; 
            border: 4px solid white; 
            padding: 6px 8px; 
            border-radius: 5px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center;
            gap: 4px; 
            font-size: 10px; 
            flex: 1;
        }
        
        .volume-control { display: flex; align-items: center; gap: 6px; }

        .lan-btn {
            background: transparent;
            border: none;
            width: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
            padding: 0;
            flex-shrink: 0;
        }
        .lan-btn:hover { transform: scale(1.05); }
        .lan-btn img {
            width: 45px;
            height: 45px;
            object-fit: visible;
            image-rendering: pixelated;
        }

        .back-map-btn {
            display: none;
            background: black;
            color: white !important;
            border: 3px solid white;
            padding: 8px 12px;
            font-family: 'WhFont', cursive !important;
            font-size: 10px !important;
            cursor: pointer;
            border-radius: 5px;
            flex: 1;
            text-align: center;
            align-items: center;
            justify-content: center;
            outline: none;
        }
        .back-map-btn.show { display: flex; }
        .back-map-btn:hover { background: white; color: black !important; border-color: #ffff00; }

        .shop-controls {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
        }
        .shop-controls.show { display: flex; }

        .shop-top-row { display: flex; gap: 6px; align-items: stretch; }

        .shop-select-card {
            background: black;
            border: 4px solid white;
            border-radius: 5px;
            padding: 10px;
            box-sizing: border-box;
            width: 100%;
        }

        .shop-dialogue-card {
            background: black;
            border: 4px solid white;
            border-radius: 5px;
            padding: 12px;
            box-sizing: border-box;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sans-box {
            background: black;
            border: 4px solid white;
            border-radius: 5px;
            padding: 10px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
            width: 100%;
            box-sizing: border-box;
        }
        .shop-dialogue-text {
            font-family: 'NoteThis', sans-serif !important;
            font-size: 15px !important;
            line-height: 1.4;
            color: #ffffff !important;
            flex: 1;
            min-width: 0;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .swipe-wrapper { 
            position: relative; 
            overflow: hidden; 
            border-radius: 5px; 
            margin-bottom: 6px; 
            background: #2196F3; 
            width: 100%;
            box-sizing: border-box;
        }
        .delete-bg { 
            position: absolute; 
            left: 0; 
            top: 0; 
            bottom: 0; 
            width: 80px; 
            background: #f44336; 
            color: white !important; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: bold; 
            font-size: 10px !important; 
            z-index: 1; 
            font-family: 'WhFont', cursive !important; 
        }

        .left-bg {
            position: absolute; 
            right: 0; 
            top: 0; 
            bottom: 0; 
            width: 80px; 
            background: #2196F3; 
            color: white !important; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: bold; 
            font-size: 10px !important; 
            z-index: 1; 
            font-family: 'WhFont', cursive !important; 
        }
        
        .swipe-btn { 
            position: relative;
            background: black; 
            color: white !important; 
            border: 2px solid white; 
            text-align: left; 
            padding: 10px; 
            border-radius: 5px; 
            font-family: 'WhFont', cursive !important;
            font-size: 10px !important;
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            width: 100%; 
            cursor: pointer; 
            z-index: 2;
            box-sizing: border-box;
            touch-action: pan-y;
            outline: none;
        }
        .swipe-btn:hover { background: #111; border-color: #ffff00; }

        .ders-block { background: black; border: 4px solid white; border-radius: 5px; margin-bottom: 6px; overflow: hidden; }
        
        .ders-header-content { 
            background: black; 
            padding: 8px 10px; 
            color: #ffffff !important; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 10px !important; 
            width: 100%; 
            cursor: pointer; 
            border: 2px solid white; 
            text-align: left; 
            border-radius: 5px;
            font-family: 'WhFont', cursive !important;
            box-sizing: border-box;
            outline: none;
        }
        .ders-icerik { display: none; padding: 6px; background: #050505; }

        .konu-header { 
            padding: 8px; 
            font-size: 9px !important; 
            font-family: 'WhFont', cursive !important;
            color: #fff !important; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            cursor: pointer; 
            background: black; 
            width: 100%; 
            border: 2px solid white; 
            border-radius: 5px; 
            text-align: left; 
            box-sizing: border-box;
            outline: none;
        }
        .konu-detay { display: none; padding: 8px; background: black; border: 2px dashed #666; margin-top: 4px; border-radius: 5px; }

        .undertale-box { 
            background: black; 
            border: 4px solid white; 
            border-radius: 5px; 
            padding: 8px; 
            display: flex; 
            gap: 8px; 
            align-items: flex-start; 
            margin-top: 6px; 
            min-height: 60px;
            box-sizing: border-box;
            width: 100%;
        }
        .toriel-avatar { 
            width: 42px; 
            height: 42px; 
            object-fit: contain; 
            flex-shrink: 0; 
            image-rendering: pixelated; 
        }
        .dialogue-text { 
            font-family: 'WhFont', cursive !important; 
            font-size: 9px !important; 
            line-height: 1.6; 
            color: #ffffff !important; 
            flex: 1; 
            min-width: 0;
            white-space: pre-wrap; 
            word-break: break-word; 
        }

        .chart-box { 
            width: 130px; 
            height: 130px; 
            margin: 6px auto; 
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .chart-box canvas {
            width: 120px;
            height: 120px;
            position: absolute;
            top: 5px; left: 5px;
            image-rendering: pixelated;
        }

        .bar-chart-container {
            width: 100%;
            background: #000;
            border: 2px solid white;
            padding: 8px 4px 4px 4px;
            box-sizing: border-box;
            margin-top: 6px;
            border-radius: 4px;
        }
        .bar-chart-title {
            font-family: 'WhFont', cursive !important;
            font-size: 8px !important;
            color: #ffff00 !important;
            margin-bottom: 6px;
            text-align: center;
        }
        .bar-chart-canvas-box {
            width: 100%;
            height: 130px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: auto;
            position: relative;
        }

        #chartTooltip {
            position: absolute;
            display: none;
            background: black;
            border: 2px solid white;
            color: #ffff00 !important;
            font-family: 'WhFont', cursive !important;
            font-size: 8px !important;
            padding: 2px 4px;
            z-index: 99;
            pointer-events: none;
            white-space: nowrap;
            transform: translateX(-50%);
        }
        
        .back-btn { 
            background: black; 
            color: white !important; 
            border: 2px solid white;
            width: auto; 
            padding: 5px 8px; 
            font-size: 9px !important; 
            font-family: 'WhFont', cursive !important;
            cursor: pointer;
            outline: none;
        }
        .back-btn:hover { border-color: #ffff00; color: #ffff00 !important; }
        
        #welcomeScreen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            box-sizing: border-box;
            padding: 12px;
            transition: opacity 0.8s ease;
            pointer-events: auto;
        }
        .welcome-container { max-width: 420px; width: 100%; text-align: center; }

        #videoOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }
        #videoOverlay video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #mainAppContent { display: none; opacity: 0; transition: opacity 0.8s ease; }
    </style>
</head>
<body>

    <!-- video overlay -->
    <div id="videoOverlay">
        <video id="nikVideo" src="nik.mp4" playsinline></video>
    </div>

    <!-- başlangıç ekranı -->
    <div id="welcomeScreen">
        <div class="welcome-container">
            <div class="undertale-box" style="margin-bottom: 12px; text-align: left;">
                <img id="welcomeTorielImg" src="https://i.ibb.co/bgVjVpPK/toriel.png" class="toriel-avatar" alt="Toriel">
                <div id="welcomeDialogue" class="dialogue-text"></div>
            </div>
            <button id="startAppBtn" class="start-text-btn" onclick="baslatUygulama()">* BAŞLA</button>
        </div>
    </div>

    <!-- ana uygulama içeriği -->
    <div id="mainAppContent">
        
        <!-- bb.gif arka planındayken üst bar -->
        <div id="bbTopBar" class="top-bar">
            <button class="bb-return-btn" onclick="goBackFromBbBg()">← GERİ DÖN</button>
            <div class="music-panel">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-family: 'WhFont', cursive !important; color: #ffffff !important; font-size: 9px !important;">🎵 Wew</span>
                    <button id="wewMusicBtn" onclick="toggleWewMusic()" style="width: auto; padding: 2px 4px; font-size: 8px !important; font-family: 'WhFont', cursive !important; background:black; color:white !important; border: 2px solid white; cursor: pointer; outline: none;">⏸ DURDUR</button>
                </div>
                <div class="volume-control">
                    <label style="margin:0; font-size:8px !important;">Ses:</label>
                    <input type="range" id="wewVolumeSlider" min="0" max="1" step="0.01" value="0.3" oninput="changeWewVolume(this.value)" style="cursor: pointer; height: 6px;">
                </div>
            </div>
        </div>

        <!-- bb.gif arka planındayken rapor alanı (sadece hoş.png sabit, ses yok) -->
        <div id="bbContentArea">
            <div class="card">
                <h3>📜 DENEME RAPORU</h3>
                <div class="undertale-box" style="margin-top: 6px;">
                    <img id="bbHosImg" src="hoş.png" class="toriel-avatar" alt="Hos">
                    <div id="bbDialogue" class="dialogue-text"></div>
                </div>
            </div>
        </div>

        <div class="top-bar" id="normalTopBar">
            <div class="music-panel">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span id="musicTitle" style="font-family: 'WhFont', cursive !important; color: #ffffff !important; font-size: 9px !important;">🎵 Fallen Down</span>
                    <button id="bgMusicBtn" onclick="toggleBgMusic()" style="width: auto; padding: 2px 4px; font-size: 8px !important; font-family: 'WhFont', cursive !important; background:black; color:white !important; border: 2px solid white; cursor: pointer; outline: none;">⏸ DURDUR</button>
                </div>
                <div class="volume-control">
                    <label style="margin:0; font-size:8px !important;">Ses:</label>
                    <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.3" oninput="changeVolume(this.value)" style="cursor: pointer; height: 6px;">
                </div>
            </div>
            <div class="lan-btn" onclick="goToKakaBg()" title="Özel Arka Plana Git">
                <img src="lan.png" alt="Lan">
            </div>
        </div>

        <div id="shopControls" class="shop-controls">
            <div class="shop-top-row">
                <button id="backMapBtn" class="back-map-btn show" onclick="goBackFromKakaBg()">← GERİ DÖN</button>
                <div class="music-panel">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span id="shopMusicTitle" style="font-family: 'WhFont', cursive !important; color: #ffffff !important; font-size: 9px !important;">🎵 Shop</span>
                        <button id="shopBgMusicBtn" onclick="toggleBgMusic()" style="width: auto; padding: 2px 4px; font-size: 8px !important; font-family: 'WhFont', cursive !important; background:black; color:white !important; border: 2px solid white; cursor: pointer; outline: none;">⏸ DURDUR</button>
                    </div>
                    <div class="volume-control">
                        <label style="margin:0; font-size:8px !important;">Ses:</label>
                        <input type="range" id="shopVolumeSlider" min="0" max="1" step="0.01" value="0.3" oninput="changeVolume(this.value)" style="cursor: pointer; height: 6px;">
                    </div>
                </div>
            </div>

            <div class="shop-select-card">
                <label style="font-family: 'WhFont', cursive !important; font-size: 9px !important; color: #ffff00 !important; margin-bottom: 4px;">🎯 TYT / AYT DERS HEDEFLERİ:</label>
                <div class="row" style="margin-bottom: 4px;">
                    <input type="text" id="hedefDersAdi" placeholder="Ders Adı (Örn: Matematik)" style="flex: 2;">
                    <select id="hedefDersTuru" style="flex: 1;">
                        <option value="TYT">TYT</option>
                        <option value="AYT">AYT</option>
                    </select>
                </div>
                <div class="row" style="margin-bottom: 4px;">
                    <input type="number" id="hedefDersNet" placeholder="Hedef Net (Örn: 30)" style="flex: 2;">
                    <button class="back-btn" onclick="hedefDersEkle()" style="flex: 1; font-size:8px !important;">HEDEF EKLE</button>
                </div>
                <div id="hedefDersListesi" style="margin-top: 6px; max-height: 90px; overflow-y: auto; font-size: 8px; font-family: 'WhFont', cursive !important;"></div>
            </div>

            <div class="shop-select-card">
                <label style="font-family: 'WhFont', cursive !important; font-size: 9px !important; color: #ffff00 !important; margin-bottom: 4px;">KONU ANALİZİ SEÇ:</label>
                <select id="konuSecimSelect" onchange="konuAnalizGoster(this.value)">
                    <option value="">* Bir konu seçin...</option>
                </select>
            </div>

            <div class="shop-dialogue-card">
                <div class="chart-box" id="shopChartContainer" style="display:none;">
                    <canvas id="shopCanvas" width="130" height="120"></canvas>
                </div>
                
                <div class="bar-chart-container" id="barChartCardContainer" style="display:none;">
                    <div class="bar-chart-title">DENEMELERE GÖRE DOĞRU / YANLIŞ / BOŞ</div>
                    <div class="bar-chart-canvas-box" id="barCanvasBox">
                        <canvas id="barCanvas" width="400" height="130"></canvas>
                        <div id="chartTooltip"></div>
                    </div>
                </div>

                <div class="sans-box" style="display: block;">
                    <div id="shopDialogueText" class="shop-dialogue-text">* Greetings... Choose a topic above to unveil the secrets of your trials.</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>➕ DENEME VE KONU EKLE</h3>
            <div class="row">
                <div class="form-group" style="flex: 2;">
                    <label>DENEME ADI</label>
                    <input type="text" id="denemeAdi" placeholder="Örn: TYT 1">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>TOPLAM SORU</label>
                    <input type="number" id="denemeToplamSoru" placeholder="120">
                </div>
            </div>
            <div class="row">
                <div class="form-group" style="flex: 1;">
                    <label>DENEME TÜRÜ</label>
                    <select id="denemeTuru">
                        <option value="TYT">TYT</option>
                        <option value="AYT">AYT</option>
                        <option value="TYT/AYT Karışık">TYT/AYT Karışık</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>TARİH</label>
                    <input type="date" id="denemeTarihi">
                </div>
            </div>
            
            <!-- KAYITLI DERSLER / HIZLI SEÇİM ALANI -->
            <div class="row" style="margin-bottom: 6px;">
                <div class="form-group" style="flex: 1; margin-bottom:0;">
                    <label style="color:#ffff00 !important;">KAYITLI DERSLERDEN SEÇ</label>
                    <select id="kayitliDersSecim" onchange="dersSecimiGuncelle(this.value)">
                        <option value="">* Ders seç veya yeni yaz...</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="form-group" style="flex: 1.5;">
                    <label>DERS ADI</label>
                    <input type="text" id="dersAdi" placeholder="Matematik" oninput="dersAdiDegisti(this.value)">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>DERS SORU</label>
                    <input type="number" id="dersSoruSayisi" placeholder="40">
                </div>
            </div>

            <!-- KAYITLI KONULAR / HIZLI SEÇİM ALANI -->
            <div class="row" style="margin-bottom: 6px;">

    function torielDenemeRaporuVer(denemeIsmi) {
        let tumDenemeler = getStorageData('myDenemeler', {});
        let denemeUstBilgiler = getStorageData('myDenemeUstBilgiler', {});
        let hedefDersler = getStorageData('myHedefDersler', {});
        let kayitlar = tumDenemeler[denemeIsmi] || [];
        let bilgi = denemeUstBilgiler[denemeIsmi] || {};

        let turu = bilgi.turu || "TYT";
        let tarihi = bilgi.tarih || "-";

        let toplamDogru = 0, toplamYanlis = 0;
        let derslerMap = {};
        let calisilmasiGerekenKonular = [];

        kayitlar.forEach(k => {
            toplamDogru += k.dogru;
            toplamYanlis += k.yanlis;
            if (!derslerMap[k.ders]) {
                derslerMap[k.ders] = { dogru: 0, yanlis: 0 };
            }
            derslerMap[k.ders].dogru += k.dogru;
            derslerMap[k.ders].yanlis += k.yanlis;

            let konuBasari = k.toplam > 0 ? (k.dogru / k.toplam) * 100 : 0;
            if (konuBasari < 70) {
                calisilmasiGerekenKonular.push(`${k.ders} - ${k.konu} (%${konuBasari.toFixed(0)} başarı)`);
            }
        });

        let toplamNet = parseFloat(Math.max(0, toplamDogru - (toplamYanlis / 4)).toFixed(2));

        let raporMetni = `Deneme Adı: ${denemeIsmi}\n`;
        raporMetni += `Tür: ${turu} | Tarih: ${tarihi}\n`;
        raporMetni += `----------------------------------------\n`;
        raporMetni += `Toplam Net: ${toplamNet}\n\n[Ders Hedef Karşılaştırmaları]:\n`;

        for (const [dersAdi, dVerisi] of Object.entries(derslerMap)) {
            let dersNet = parseFloat(Math.max(0, dVerisi.dogru - (dVerisi.yanlis / 4)).toFixed(2));
            raporMetni += `• ${dersAdi}: ${dersNet} Net`;

            let dersHedefObj = hedefDersler[dersAdi];
            if (dersHedefObj) {
                let hNet = parseFloat(dersHedefObj.net);
                let fark = (dersNet - hNet).toFixed(2);
                if (dersNet >= hNet) {
                    raporMetni += ` -> HEDEF GEÇİLDİ! (Hedef: ${hNet} ✅ +${Math.abs(fark)})\n`;
                } else {
                    raporMetni += ` -> HEDEFİN ALTINDA (Hedef: ${hNet} ❌ ${fark})\n`;
                }
            } else {
                raporMetni += ` (Hedef Belirtilmemiş)\n`;
            }
        }

        raporMetni += `----------------------------------------\n`;
        if (calisilmasiGerekenKonular.length > 0) {
            raporMetni += `📚 Çalışman Gereken Konular:\n`;
            calisilmasiGerekenKonular.forEach(konuStr => {
                raporMetni += `- ${konuStr}\n`;
            });
        } else {
            raporMetni += `✨ Harika! Bu denemede kritik eksik konun görünmüyor.\n`;
        }

        typeWriterReport("bbDialogue", "bbHosImg", raporMetni);
    }

    function makeDualSwipeable(element, onDeleteCallback, onLeftSwipeCallback, onClickCallback) {
        let startX = 0;
        let currentTranslate = 0;
        let isDragging = false;

        const touchStart = (e) => {
            startX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            isDragging = false;
            document.addEventListener('mousemove', touchMove);
            document.addEventListener('mouseup', touchEnd);
            document.addEventListener('touchmove', touchMove, { passive: true });
            document.addEventListener('touchend', touchEnd);
        };

        const touchMove = (e) => {
            const currentX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const diff = currentX - startX;
            if (Math.abs(diff) > 5) {
                isDragging = true;
            }
            if (Math.abs(diff) < 160) {
                currentTranslate = diff;
                element.style.transform = `translateX(${currentTranslate}px)`;
            }
        };

        const touchEnd = () => {
            document.removeEventListener('mousemove', touchMove);
            document.removeEventListener('mouseup', touchEnd);
            document.removeEventListener('touchmove', touchMove);
            document.removeEventListener('touchend', touchEnd);

            if (currentTranslate > 50) {
                onDeleteCallback();
            } else if (currentTranslate < -50) {
                onLeftSwipeCallback();
            } else {
                currentTranslate = 0;
                element.style.transform = `translateX(0px)`;
            }
            setTimeout(() => { isDragging = false; }, 50);
        };

        element.addEventListener('mousedown', touchStart);
        element.addEventListener('touchstart', touchStart, { passive: true });

        if (onClickCallback) {
            element.addEventListener('click', (e) => {
                if (!isDragging) onClickCallback(e);
            });
        }
    }

        const denemeAdi = document.getElementById('denemeAdi').value.trim();
        const denemeToplamSoru = parseInt(document.getElementById('denemeToplamSoru').value) || 0;
        const denemeTuru = document.getElementById('denemeTuru').value;
        const denemeTarihi = document.getElementById('denemeTarihi').value;
        const dersAdi = document.getElementById('dersAdi').value.trim();
        const dersSoruSayisi = parseInt(document.getElementById('dersSoruSayisi').value) || 0;
        const konuAdi = document.getElementById('konuAdi').value.trim();
        const toplamSoru = parseInt(document.getElementById('toplamSoru').value) || 0;
        const dogru = parseInt(document.getElementById('dogru').value) || 0;
        const yanlis = parseInt(document.getElementById('yanlis').value) || 0;
        const bos = parseInt(document.getElementById('bos').value) || 0;

        if (!denemeAdi || !dersAdi || !konuAdi || !denemeTarihi || toplamSoru <= 0 || dersSoruSayisi <= 0 || denemeToplamSoru <= 0) {
            gosterFormUyarisi("* Lütfen tüm alanları eksiksiz doldurun, evladım!");
            return;
        }

        if ((dogru + yanlis + bos) !== toplamSoru) {
            gosterFormUyarisi(`* Doğru (${dogru}), yanlış (${yanlis}) and boş (${bos}) toplamı, konunun toplam soru sayısına (${toplamSoru}) eşit olmalıdır!`);
            return;
        }

        // Ders ve konuyu kalıcı hafızaya kaydet
        kayitliDersVeKonulariKaydet(dersAdi, konuAdi);

        let tumDenemeler = getStorageData('myDenemeler', {});
        let denemeUstBilgiler = getStorageData('myDenemeUstBilgiler', {});

        denemeUstBilgiler[denemeAdi] = {
            toplamSoru: denemeToplamSoru,
            turu: denemeTuru,
            tarih: denemeTarihi
        };

        if (!tumDenemeler[denemeAdi]) tumDenemeler[denemeAdi] = [];

        let tumDerslerSoruToplami = 0;
        let mevcutDersSoruToplami = 0;
        let hesaplananDersler = {};

        tumDenemeler[denemeAdi].forEach(item => {
            if (!hesaplananDersler[item.ders]) hesaplananDersler[item.ders] = item.dersToplamSoru;
            if (item.ders === dersAdi) mevcutDersSoruToplami += item.toplam;
        });
        hesaplananDersler[dersAdi] = dersSoruSayisi;

        for (let d in hesaplananDersler) { tumDerslerSoruToplami += hesaplananDersler[d]; }

        if (tumDerslerSoruToplami > denemeUstBilgiler[denemeAdi].toplamSoru) {
            gosterFormUyarisi(`* Bu ders ile birlikte denemedeki tüm derslerin toplam soru sayısı (${tumDerslerSoruToplami}), deneme üst sınırını (${denemeUstBilgiler[denemeAdi].toplamSoru}) geçiyor!`);
            return;
        }

        if ((mevcutDersSoruToplami + toplamSoru) > dersSoruSayisi) {
            gosterFormUyarisi(`* Bu ders için girdiğiniz toplam soru sayısı (${dersSoruSayisi}) sınırını aşıyor!`);
            return;
        }

        const basariOrani = (dogru / toplamSoru) * 100;
        const isPass = basariOrani >= 70;
        
        const mesaj = isPass 
            ? "* Harika bir iş çıkardın, evladım!\n* Bu konuya tekrar çalışmana gerek yok." 
            : "* Görünüşe göre biraz zorlanmışsın...\n* Lütfen bu konuyu bir kez daha gözden geçir, olur mu?";

        tumDenemeler[denemeAdi].push({
            ders: dersAdi,
            dersToplamSoru: dersSoruSayisi,
            konu: konuAdi,
            toplam: toplamSoru,
            dogru: dogru,
            yanlis: yanlis < 0 ? 0 : yanlis,
            bos: bos < 0 ? 0 : bos,
            oran: basariOrani.toFixed(0),
            torielMesaj: mesaj,
            isPass: isPass
        });

        setStorageData('myDenemeler', tumDenemeler);
        setStorageData('myDenemeUstBilgiler', denemeUstBilgiler);

        document.getElementById('konuAdi').value = '';
        document.getElementById('toplamSoru').value = '';
        document.getElementById('dogru').value = '';
        document.getElementById('yanlis').value = '';
        document.getElementById('bos').value = '';

        denemeleriYukle();
    }

    function denemeleriYukle() {
        const listeDiv = document.getElementById('denemeListesi');
        let tumDenemeler = getStorageData('myDenemeler', {});
        let denemeUstBilgiler = getStorageData('myDenemeUstBilgiler', {});
        
        listeDiv.innerHTML = "";
        const isimler = Object.keys(tumDenemeler);

        if (isimler.length === 0) {
            listeDiv.innerHTML = "<p style='color:#777; font-size:9px !important; font-family:\"WhFont\", cursive !important; padding: 6px;'>Henüz kayıtlı deneme yok.</p>";
            return;
        }

        isimler.forEach((isim, index) => {
            const siraNo = index + 1;
            const kayitlar = tumDenemeler[isim] || [];
            
            let bilgi = denemeUstBilgiler[isim];
            let maxSoru = 0, turu = "TYT", tarihi = "-";
            if (bilgi) {
                if (typeof bilgi === 'object') {
                    maxSoru = bilgi.toplamSoru || 0;
                    turu = bilgi.turu || "TYT";
                    tarihi = bilgi.tarih || "-";
                } else {
                    maxSoru = bilgi;
                }
            }
            
            let toplamDogru = 0, toplamYanlis = 0;
            kayitlar.forEach(k => { 
                toplamDogru += k.dogru; 
                toplamYanlis += k.yanlis;
            });
            
            const toplamNet = Math.max(0, toplamDogru - (toplamYanlis / 4)).toFixed(2);
            const denemeBasariOrani = maxSoru > 0 ? ((toplamDogru / maxSoru) * 100).toFixed(0) : 0;

            const wrapper = document.createElement('div');
            wrapper.className = "swipe-wrapper";

            const deleteBg = document.createElement('div');
            deleteBg.className = "delete-bg";
            deleteBg.innerText = "SİL";

            const leftBg = document.createElement('div');
            leftBg.className = "left-bg";
            leftBg.innerText = "NİK";

            const btn = document.createElement('div');
            btn.className = "swipe-btn";
            
            btn.innerHTML = `<span>${siraNo}. 📘 ${isim} <span style="font-size:7px !important; color:#aaa !important; font-weight:normal; display:block; margin-top:2px;">[${turu} - ${tarihi}] | Net: <b style="color:#ffff00">${toplamNet}</b></span></span> <span style="font-size:9px !important; color:#ffff00 !important;">%${denemeBasariOrani} ❯</span>`;
            
            makeDualSwipeable(btn, () => {
                if (confirm(`"${isim}" adlı denemeyi silmek istediğine emin misin?`)) {
                    delete tumDenemeler[isim];
                    delete denemeUstBilgiler[isim];
                    setStorageData('myDenemeler', tumDenemeler);
                    setStorageData('myDenemeUstBilgiler', denemeUstBilgiler);
                    denemeleriYukle();
                } else {
                    btn.style.transform = `translateX(0px)`;
                }
            }, () => {
                triggerNikVideo(isim);
            }, () => {
                denemeDetayGoster(isim);
            });

            wrapper.appendChild(deleteBg);
            wrapper.appendChild(leftBg);
            wrapper.appendChild(btn);
            listeDiv.appendChild(wrapper);
        });
    }

    let heartMaskImage = new Image();
    heartMaskImage.crossOrigin = "anonymous";
    heartMaskImage.src = "https://i.ibb.co/4Z09dCDt/ah.png";

    function drawPieChartWithHeartMask(canvasId, dogru, yanlis, bos) {
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let total = dogru + yanlis + bos;
        if (total <= 0) total = 1;

        let angles = [
            { count: dogru, color: '#00c000' },   
            { count: yanlis, color: '#ff0000' },  
            { count: bos, color: '#555555' }      
        ];

        let cx = canvas.width / 2;
        let cy = canvas.height / 2;
        let radius = Math.max(cx, cy) * 1.2;

        let tempCanvas = document.createElement('canvas');
        tempCanvas.width = canvas.width;
        tempCanvas.height = canvas.height;
        let tempCtx = tempCanvas.getContext('2d');

        let currentAngle = -Math.PI / 2;
        angles.forEach(slice => {
            if (slice.count <= 0) return;
            let sliceAngle = (slice.count / total) * (2 * Math.PI);
            tempCtx.beginPath();
            tempCtx.moveTo(cx, cy);
            tempCtx.arc(cx, cy, radius, currentAngle, currentAngle + sliceAngle + 0.05);
            tempCtx.closePath();
            tempCtx.fillStyle = slice.color;
            tempCtx.strokeStyle = slice.color;
            tempCtx.lineWidth = 2;
            tempCtx.fill();
            tempCtx.stroke();
            currentAngle += sliceAngle;
        });

        if (heartMaskImage.complete && heartMaskImage.naturalWidth !== 0) {
            tempCtx.globalCompositeOperation = 'destination-in';
            tempCtx.drawImage(heartMaskImage, 0, 0, tempCanvas.width, tempCanvas.height);
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(tempCanvas, 0, 0);
    }

    function drawAnimatedGroupedBarChart(canvasId, dataList) {
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!dataList || dataList.length === 0) return;

        let dynamicWidth = Math.max(380, dataList.length * 50 + 35);
        canvas.width = dynamicWidth;
        canvas.style.width = dynamicWidth + "px";

        let maxSoru = 1;
        dataList.forEach(item => {
            let m = Math.max(item.dogru, item.yanlis, item.bos);
            if (m > maxSoru) maxSoru = m;
        });

        let paddingBottom = 20, paddingTop = 10;
        let chartHeight = canvas.height - paddingBottom - paddingTop;
        let chartWidth = canvas.width;
        let startTime = performance.now();
        let duration = 600;

        barHitboxes = [];

        function animate(currentTime) {
            let elapsed = currentTime - startTime;
            let progress = Math.min(elapsed / duration, 1);
            let easeProgress = 1 - Math.pow(1 - progress, 3);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#333333';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 4; i++) {
                let y = paddingTop + (chartHeight / 4) * i;
                ctx.beginPath(); ctx.moveTo(25, y); ctx.lineTo(chartWidth - 10, y); ctx.stroke();
                let valLabel = Math.round(maxSoru - (maxSoru / 4) * i);
                ctx.fillStyle = '#888888'; ctx.font = '7px sans-serif'; ctx.fillText(valLabel, 2, y + 3);
            }

            let groupWidth = (chartWidth - 35) / dataList.length;
            let barWidth = Math.max(3, Math.min(9, groupWidth / 4)); 
            let currentHitboxes = [];

            dataList.forEach((item, index) => {
                let groupX = 35 + index * groupWidth + (groupWidth - (barWidth * 3 + 4)) / 2;
                let hD = (item.dogru / maxSoru) * chartHeight * easeProgress;
                let hY = (item.yanlis / maxSoru) * chartHeight * easeProgress;
                let hB = (item.bos / maxSoru) * chartHeight * easeProgress;
                let baseY = paddingTop + chartHeight;

                let xD = groupX, xY = groupX + barWidth + 2, xB = groupX + (barWidth * 2) + 4;

                ctx.fillStyle = '#00c000'; ctx.fillRect(xD, baseY - hD, barWidth, hD);
                ctx.fillStyle = '#ff0000'; ctx.fillRect(xY, baseY - hY, barWidth, hY);
                ctx.fillStyle = '#777777'; ctx.fillRect(xB, baseY - hB, barWidth, hB);

                if (progress === 1) {
                    ctx.fillStyle = '#ffffff'; ctx.font = '6px sans-serif'; ctx.textAlign = 'center';
                    ctx.fillText(item.dogru, xD + barWidth/2, baseY - hD - 2);
                    ctx.fillText(item.yanlis, xY + barWidth/2, baseY - hY - 2);
                    ctx.fillText(item.bos, xB + barWidth/2, baseY - hB - 2);
                    ctx.textAlign = 'start';
                }

                ctx.fillStyle = '#ffffff'; ctx.font = '7px "WhFont", sans-serif'; ctx.textAlign = 'center';
                let numX = groupX + barWidth + 2;
                ctx.fillText(item.no, numX, canvas.height - 5);
                ctx.textAlign = 'start';

                if (progress === 1) {
                    currentHitboxes.push({
                        x: groupX - 4, y: 0, w: (barWidth * 3 + 4) + 8, h: canvas.height,
                        centerX: numX, topY: paddingTop,
                        text: `Deneme ${item.no} -> D: ${item.dogru} | Y: ${item.yanlis} | B: ${item.bos}`
                    });
                }
            });

            barHitboxes = currentHitboxes;
            if (progress < 1) requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);
    }

    const barBoxEl = document.getElementById('barCanvasBox');
    const tooltipEl = document.getElementById('chartTooltip');

    barBoxEl.addEventListener('mousemove', (e) => {
        const rect = barBoxEl.getBoundingClientRect();
        const mouseX = e.clientX - rect.left + barBoxEl.scrollLeft;
        const mouseY = e.clientY - rect.top;
        let hovered = null;
        barHitboxes.forEach(box => {
            if (mouseX >= box.x && mouseX <= box.x + box.w && mouseY >= box.y && mouseY <= box.y + box.h) hovered = box;
        });
        if (hovered) {
            tooltipEl.style.display = 'block';
            tooltipEl.innerText = hovered.text;
            tooltipEl.style.left = hovered.centerX + 'px';
            tooltipEl.style.top = (hovered.topY - 10) + 'px';
        } else {
            tooltipEl.style.display = 'none';
        }
    });

    barBoxEl.addEventListener('mouseleave', () => { tooltipEl.style.display = 'none'; });

    function durdurYazici() {
        if (aktifYaziciTimer) { clearInterval(aktifYaziciTimer); aktifYaziciTimer = null; }
        const sansAudio = document.getElementById('sansVoice');
        if (sansAudio) { sansAudio.pause(); sansAudio.currentTime = 0; }
        const torielVoice = document.getElementById('torielVoice');
        if (torielVoice) { torielVoice.pause(); torielVoice.currentTime = 0; }
    }

    function typeWriterWelcome(elementId, imgId, text) {
        durdurYazici();
        let i = 0;
        const textContainer = document.getElementById(elementId);
        const imgElement = document.getElementById(imgId);
        const torielAudio = document.getElementById('torielVoice');
        if (!textContainer || !imgElement || !text) return;
        textContainer.innerText = "";
        imgElement.src = TORIEL_IMG_1;

        if (torielAudio) {
            torielAudio.loop = true;
            torielAudio.currentTime = 0;
            torielAudio.play().catch(e => {});
        }

        let toggleImg = false;
        aktifYaziciTimer = setInterval(() => {
            if (i < text.length) {
                textContainer.innerText += text.charAt(i);
                if (text.charAt(i).trim() !== "") {
                    toggleImg = !toggleImg;
                    imgElement.src = toggleImg ? TORIEL_IMG_2 : TORIEL_IMG_1;
                }
                i++;
            } else {
                clearInterval(aktifYaziciTimer);
                aktifYaziciTimer = null;
                imgElement.src = TORIEL_IMG_1;
                if (torielAudio) { torielAudio.pause(); torielAudio.currentTime = 0; }
            }
        }, 45);
    }
